<rect width="1150" height="420" rx="30" fill="#f5f0e6"/><text x="50" y="62" class="serif" font-size="30" font-weight="700" fill="#1c1c1c">Cross-validated RMSE by approach</text><text x="50" y="90" font-size="16" fill="#5f5b53">10-fold CV, every parameter refit inside the fold. Lower is better. Logarithmic scale.</text><text x="362" y="155" text-anchor="end" font-size="17" font-weight="700" fill="#1c1c1c">V2  coupled mass + energy balance</text><rect x="380" y="130" width="620" height="34" rx="8" fill="#ebe4d5"/><rect class="bw" style="animation-delay:0.0s" x="380" y="130" width="108.2" height="34" rx="8" fill="#cf6a4c"/><text class="vl" style="animation-delay:1.1s" x="500.2" y="154" font-size="18" font-weight="700" fill="#1c1c1c">4.645</text><text x="362" y="210" text-anchor="end" font-size="17" font-weight="400" fill="#1c1c1c">V1  closed-form physics</text><rect x="380" y="185" width="620" height="34" rx="8" fill="#ebe4d5"/><rect class="bw" style="animation-delay:0.18s" x="380" y="185" width="252.1" height="34" rx="8" fill="#aaa395"/><text class="vl" style="animation-delay:1.28s" x="644.1" y="209" font-size="18" font-weight="700" fill="#1c1c1c">14.242</text><text x="362" y="265" text-anchor="end" font-size="17" font-weight="400" fill="#1c1c1c">V1 + ridge residual corrector</text><rect x="380" y="240" width="620" height="34" rx="8" fill="#ebe4d5"/><rect class="bw" style="animation-delay:0.36s" x="380" y="240" width="255.9" height="34" rx="8" fill="#aaa395"/><text class="vl" style="animation-delay:1.46s" x="647.9" y="264" font-size="18" font-weight="700" fill="#1c1c1c">14.671</text><text x="362" y="320" text-anchor="end" font-size="17" font-weight="400" fill="#1c1c1c">Polynomial-4 + ridge</text><rect x="380" y="295" width="620" height="34" rx="8" fill="#ebe4d5"/><rect class="bw" style="animation-delay:0.54s" x="380" y="295" width="334.9" height="34" rx="8" fill="#aaa395"/><text class="vl" style="animation-delay:1.6400000000000001s" x="726.9" y="319" font-size="18" font-weight="700" fill="#1c1c1c">27.145</text><text x="362" y="375" text-anchor="end" font-size="17" font-weight="400" fill="#1c1c1c">Polynomial-4 (no penalty)</text><rect x="380" y="350" width="620" height="34" rx="8" fill="#ebe4d5"/><rect class="bw" style="animation-delay:0.72s" x="380" y="350" width="515.2" height="34" rx="8" fill="#aaa395"/><text class="vl" style="animation-delay:1.82s" x="907.2" y="374" font-size="18" font-weight="700" fill="#1c1c1c">110.545</text>

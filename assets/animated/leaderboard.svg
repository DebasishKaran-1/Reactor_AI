<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 420" width="1150" height="420" role="img">
<style>
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .serif{font-family:Georgia, 'Times New Roman', serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.bw{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}.vl{animation:fade .8s ease-out both}@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}@keyframes fade{0%{opacity:0}100%{opacity:1}}

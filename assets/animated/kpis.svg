<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 200" width="1180" height="200" role="img">
<style>
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .serif{font-family:Georgia, 'Times New Roman', serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.kp{animation:up 1s ease-out both}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s ease-out both}@keyframes up{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g class="kp" style="animation-delay:0.0s"><rect x="0" y="0" width="280" height="200" rx="24" fill="#f5f0e6"/><text x="28" y="98" class="serif" font-size="68" font-weight="700" fill="#1c1c1c">4.65</text><rect class="bar" style="animation-delay:0.4s" x="28" y="116" width="56" height="4" rx="2" fill="#cf6a4c"/><text x="28" y="150" font-size="16" fill="#5f5b53">10-fold CV RMSE of the</text><text x="28" y="172" font-size="16" fill="#5f5b53">final model</text></g><g class="kp" style="animation-delay:0.25s"><rect x="300" y="0" width="280" height="200" rx="24" fill="#f5f0e6"/><text x="328" y="98" class="serif" font-size="68" font-weight="700" fill="#1c1c1c">67%</text><rect class="bar" style="animation-delay:0.65s" x="328" y="116" width="56" height="4" rx="2" fill="#cf6a4c"/><text x="328" y="150" font-size="16" fill="#5f5b53">lower error than</text><text x="328" y="172" font-size="16" fill="#5f5b53">closed-form physics (V1)</text></g><g class="kp" style="animation-delay:0.5s"><rect x="600" y="0" width="280" height="200" rx="24" fill="#f5f0e6"/><text x="628" y="98" class="serif" font-size="68" font-weight="700" fill="#1c1c1c">83%</text><rect class="bar" style="animation-delay:0.9s" x="628" y="116" width="56" height="4" rx="2" fill="#cf6a4c"/><text x="628" y="150" font-size="16" fill="#5f5b53">lower error than the best</text><text x="628" y="172" font-size="16" fill="#5f5b53">ML baseline</text></g><g class="kp" style="animation-delay:0.75s"><rect x="900" y="0" width="280" height="200" rx="24" fill="#f5f0e6"/><text x="928" y="98" class="serif" font-size="68" font-weight="700" fill="#1c1c1c">8</text><rect class="bar" style="animation-delay:1.15s" x="928" y="116" width="56" height="4" rx="2" fill="#cf6a4c"/><text x="928" y="150" font-size="16" fill="#5f5b53">physical parameters,</text><text x="928" y="172" font-size="16" fill="#5f5b53">versus 126 coefficients</text></g>
</svg>
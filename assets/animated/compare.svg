<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img">
<style>
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .serif{font-family:Georgia, 'Times New Roman', serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.ln{animation:ln 12s infinite both}
@keyframes ln{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(0)}96%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="580" rx="30" fill="#f5f0e6"/><line x1="600" y1="60" x2="600" y2="470" stroke="#e2dacb" stroke-width="2"/><text x="70" y="85" class="serif" font-size="34" fill="#6d695f">A black-box model</text><text x="650" y="85" class="serif" font-size="34" font-weight="700" fill="#cf6a4c">Reactor AI</text><rect x="70" y="115" width="470" height="84" rx="22" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><text x="96" y="152" font-size="20" fill="#1c1c1c">"Flexible enough to fit anything,</text><text x="96" y="178" font-size="20" fill="#1c1c1c">including the noise."</text><rect x="650" y="115" width="480" height="84" rx="22" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><text x="676" y="152" font-size="20" fill="#1c1c1c">"Write the kinetics down. Let the data</text><text x="676" y="178" font-size="20" fill="#1c1c1c">fit eight physical constants."</text><g class="ln" style="animation-delay:0.0s"><text x="70" y="250" class="mono" font-size="19" fill="#1c1c1c" font-weight="400">$ cross_validate(poly4)</text></g><g class="ln" style="animation-delay:0.8s"><text x="70" y="294" class="mono" font-size="19" fill="#b3382c" font-weight="700">CV RMSE   110.545</text><rect x="500" y="275" width="62" height="28" rx="14" fill="#b3382c" fill-opacity=".14"/><text x="531.0" y="294" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#b3382c">FAIL</text></g><g class="ln" style="animation-delay:1.6s"><text x="70" y="338" class="mono" font-size="19" fill="#1c1c1c" font-weight="400">$ cross_validate(poly4 + ridge)</text></g><g class="ln" style="animation-delay:2.4000000000000004s"><text x="70" y="382" class="mono" font-size="19" fill="#b3382c" font-weight="700">CV RMSE    27.145</text><rect x="500" y="363" width="62" height="28" rx="14" fill="#b8862b" fill-opacity=".14"/><text x="531.0" y="382" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#b8862b">WEAK</text></g><g class="ln" style="animation-delay:3.2s"><text x="70" y="426" class="mono" font-size="19" fill="#5f5b53" font-weight="400">126 coefficients for 150 rows</text></g><g class="ln" style="animation-delay:0.4s"><text x="650" y="250" class="mono" font-size="19" fill="#1c1c1c" font-weight="400">$ fit(v2, multi_start=sobol)</text></g><g class="ln" style="animation-delay:1.2000000000000002s"><text x="650" y="294" class="mono" font-size="19" fill="#5f5b53" font-weight="400">8 parameters, RK4 energy balance</text><rect x="1090" y="275" width="62" height="28" rx="14" fill="#2a7f62" fill-opacity=".14"/><text x="1121.0" y="294" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#2a7f62">DONE</text></g><g class="ln" style="animation-delay:2.0s"><text x="650" y="338" class="mono" font-size="19" fill="#1c1c1c" font-weight="400">$ cross_validate(v2, refit_in_fold)</text></g><g class="ln" style="animation-delay:2.8000000000000003s"><text x="650" y="382" class="mono" font-size="19" fill="#2a7f62" font-weight="700">CV RMSE     4.645</text><rect x="1090" y="363" width="62" height="28" rx="14" fill="#2a7f62" fill-opacity=".14"/><text x="1121.0" y="382" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#2a7f62">PASS</text></g><g class="ln" style="animation-delay:3.6s"><text x="650" y="426" class="mono" font-size="19" fill="#5f5b53" font-weight="400">8 parameters for 150 rows</text></g><g class="ln" style="animation-delay:4.6s"><rect x="250" y="500" width="700" height="56" rx="28" fill="#cf6a4c"/><text x="600" y="535" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Cross-validated error cut by 83% versus the best ML baseline</text></g>
</svg>
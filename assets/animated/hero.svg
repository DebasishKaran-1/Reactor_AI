<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img">
<style>
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .serif{font-family:Georgia, 'Times New Roman', serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.hl{opacity:0;animation:hl 9s infinite}
@keyframes hl{0%{opacity:0}2%{opacity:1}12%{opacity:1}16%{opacity:0}100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.5)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-in-out infinite}
.r2{animation-delay:.5s}
@keyframes ring{0%{opacity:.15;transform:scale(.88)}50%{opacity:.55;transform:scale(1.06)}100%{opacity:.15;transform:scale(.88)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="500" rx="30" fill="#f5f0e6"/><text x="70" y="150" class="serif" font-size="84" font-weight="700" fill="#1c1c1c">Reactor AI</text><text x="520" y="148" class="serif" font-size="36" font-style="italic" fill="#cf6a4c">a physics-informed yield model</text><text x="70" y="240" class="serif" font-size="40" fill="#3a3834">Mechanism first. The data fixes the constants.</text><text x="70" y="288" font-size="19" fill="#5f5b53">Predicts the yield of a non-isothermal A to B to C reactor from 150 plant runs, and proves it with leakage-free cross-validation.</text><rect x="66.0" y="335" width="104" height="52" rx="26" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><rect class="hl" style="animation-delay:0.0s" x="66.0" y="335" width="104" height="52" rx="26" fill="#f6dccf" stroke="#cf6a4c" stroke-width="2.5"/><text x="118.0" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1c">Data</text><line x1="170.0" y1="361" x2="188.0" y2="361" stroke="#e2dacb" stroke-width="2"/><rect x="188.0" y="335" width="93" height="52" rx="26" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><rect class="hl" style="animation-delay:1.0s" x="188.0" y="335" width="93" height="52" rx="26" fill="#f6dccf" stroke="#cf6a4c" stroke-width="2.5"/><text x="234.5" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1c">EDA</text><line x1="281.0" y1="361" x2="299.0" y2="361" stroke="#e2dacb" stroke-width="2"/><rect x="299.0" y="335" width="146" height="52" rx="26" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><rect class="hl" style="animation-delay:2.0s" x="299.0" y="335" width="146" height="52" rx="26" fill="#f6dccf" stroke="#cf6a4c" stroke-width="2.5"/><text x="372.0" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1c">Baseline</text><line x1="445.0" y1="361" x2="463.0" y2="361" stroke="#e2dacb" stroke-width="2"/><rect x="463.0" y="335" width="178" height="52" rx="26" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><rect class="hl" style="animation-delay:3.0s" x="463.0" y="335" width="178" height="52" rx="26" fill="#f6dccf" stroke="#cf6a4c" stroke-width="2.5"/><text x="552.0" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1c">Kinetics V1</text><line x1="641.0" y1="361" x2="659.0" y2="361" stroke="#e2dacb" stroke-width="2"/><rect x="659.0" y="335" width="157" height="52" rx="26" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><rect class="hl" style="animation-delay:4.0s" x="659.0" y="335" width="157" height="52" rx="26" fill="#f6dccf" stroke="#cf6a4c" stroke-width="2.5"/><text x="737.5" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1c">Energy V2</text><line x1="816.0" y1="361" x2="834.0" y2="361" stroke="#e2dacb" stroke-width="2"/><rect x="834.0" y="335" width="146" height="52" rx="26" fill="#fbf8f1" stroke="#e2dacb" stroke-width="2"/><rect class="hl" style="animation-delay:5.0s" x="834.0" y="335" width="146" height="52" rx="26" fill="#f6dccf" stroke="#cf6a4c" stroke-width="2.5"/><text x="907.0" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1c">Validate</text><line x1="980.0" y1="361" x2="998.0" y2="361" stroke="#e2dacb" stroke-width="2"/><rect x="998.0" y="335" width="136" height="52" rx="26" fill="#cf6a4c"/><rect class="pulse" x="998.0" y="335" width="136" height="52" rx="26" fill="none" stroke="#cf6a4c" stroke-width="3"/><text x="1066.0" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Predict</text><text x="66.0" y="440" font-size="16" fill="#8a857a">Python  ·  NumPy  ·  SciPy  ·  scikit-learn  ·  10-fold cross-validation  ·  frozen model on test data</text><g transform="translate(1065,150)">
<circle class="ring r1" r="70" fill="none" stroke="#cf6a4c" stroke-width="2"/>
<circle class="ring r2" r="46" fill="none" stroke="#cf6a4c" stroke-width="2"/>
<circle r="22" fill="#cf6a4c"/>
<path d="M-9 0 L-2 7 L10 -7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>